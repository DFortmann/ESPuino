; Personal configuration (ignored by git, see .gitignore)
; ESPuino complete with rotary encoder + 11 buttons:
;   Btn0..2, Btn4, Btn5 => button connectors (PE102, PE100, PE101, PE103, PE104)
;   Btn3                => rotary encoder's button (PE105)
;   Btn6, Btn7          => ext. conn1 PE109, PE112
;   Btn8                => ext. conn1 IO5
;   Btn9..11            => resistor ladder at ext. conn1 IO32 (0 Ohm / 4.7 kOhm / 22 kOhm, pullup 10 kOhm to 3.3 V switched)

[platformio]
default_envs = complete-11buttons

[env:complete-11buttons]
extends = env:complete
build_flags = ${env:complete.build_flags}
              -DANALOG_BUTTONS_ENABLE
              -DBUTTON_6=109
              -DBUTTON_7=112
              -DBUTTON_8=5
              -DBUTTON_9=120
              -DBUTTON_10=121
              -DBUTTON_11=122
